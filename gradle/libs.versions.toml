[versions]
agp = "9.3.3"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "1.2.0"
